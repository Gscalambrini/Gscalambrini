<svg width="350" height="180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Linguagens mais usadas: Jupyter Notebook 99.4%, Python 0.4%, JavaScript 0.1%, CSS 0.1%, HTML 0.0%">
  <!--
    Card de linguagens, feito sob medida (auto-hospedado no repo).

    Por que existe, em vez de usar o servico de terceiro direto: o layout
    "compact" do github-readme-stats trava a segunda coluna em x=150, e o
    nome "Jupyter Notebook" (16 caracteres) nao cabe nisso - o texto da
    primeira coluna invade o circulo da segunda (bug confirmado inspecionando
    o SVG gerado por eles). Porcentagem em 1 casa decimal, como pedido - o
    servico de terceiro nao permite configurar isso.

    Layout: UMA coluna so, de proposito - uma tentativa com 2 colunas fixas
    parecia caber no calculo a mao, mas ao conferir de novo a porcentagem da
    coluna 2 terminava 1px depois da borda direita do card. Coluna unica
    elimina esse risco por construcao: a porcentagem fica sempre ancorada
    (text-anchor=end) numa margem direita fixa, entao nenhum nome, por maior
    que seja, pode empurrar ou encostar nela.

    Tema claro/escuro: os outros dois cards (stats, streak) resolvem isso
    com <picture> + duas URLs (um servico de terceiro que aceita "theme=" na
    query string). Aqui, como e um arquivo estatico so, uso a mesma logica
    direto em CSS dentro do proprio SVG (@media prefers-color-scheme) -
    mais simples que manter dois arquivos separados.

    Dados: bytes por linguagem, iguais aos que a API do GitHub reporta hoje
    (27/08/2026) - e uma FOTO desse momento, nao se atualiza sozinho. Pedir
    pra eu rodar de novo quando quiser refletir mudancas futuras.

    Cores dos pontos: as cores oficiais que o GitHub usa pra cada linguagem
    (Linguist), pra ficar reconhecivel - por isso e proposital usar uma cor
    por linguagem aqui, em vez de um hue so.
  -->
  <style>
    .titulo { font-family: 'Segoe UI', Ubuntu, Sans-Serif; font-weight: 600; font-size: 18px; fill: #ED145B; }
    .nome   { font-family: Inter, Ubuntu, Sans-Serif; font-size: 11px; fill: #24292f; }
    .pct    { font-family: Inter, Ubuntu, Sans-Serif; font-size: 11px; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .nome { fill: #c9d1d9; }
      .pct  { fill: #9aa4b2; }
    }
  </style>

  <text x="25" y="35" class="titulo">Linguagens mais usadas</text>

  <g transform="translate(25, 60)">
    <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="5" fill="#DA5B0B"/>
      <text x="16" y="10" class="nome">Jupyter Notebook</text>
      <text x="300" y="10" text-anchor="end" class="pct">99.4%</text>
    </g>
    <g transform="translate(0, 26)">
      <circle cx="5" cy="6" r="5" fill="#3572A5"/>
      <text x="16" y="10" class="nome">Python</text>
      <text x="300" y="10" text-anchor="end" class="pct">0.4%</text>
    </g>
    <g transform="translate(0, 52)">
      <circle cx="5" cy="6" r="5" fill="#f1e05a"/>
      <text x="16" y="10" class="nome">JavaScript</text>
      <text x="300" y="10" text-anchor="end" class="pct">0.1%</text>
    </g>
    <g transform="translate(0, 78)">
      <circle cx="5" cy="6" r="5" fill="#663399"/>
      <text x="16" y="10" class="nome">CSS</text>
      <text x="300" y="10" text-anchor="end" class="pct">0.1%</text>
    </g>
    <g transform="translate(0, 104)">
      <circle cx="5" cy="6" r="5" fill="#e34c26"/>
      <text x="16" y="10" class="nome">HTML</text>
      <text x="300" y="10" text-anchor="end" class="pct">0.0%</text>
    </g>
  </g>
</svg>
